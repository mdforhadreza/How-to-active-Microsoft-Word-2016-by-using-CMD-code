name: Build MFR Publisher APK

on:
  workflow_dispatch:
  push:
    branches:
      - mfr-publisher-build

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mfr-publisher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Copy named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MFR-Publisher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MFR-Publisher-APK
          path: mfr-publisher/MFR-Publisher.apk
          if-no-files-found: error
