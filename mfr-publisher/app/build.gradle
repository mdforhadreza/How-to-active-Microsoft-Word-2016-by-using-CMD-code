plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mdforhadreza.mfrpublisher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mdforhadreza.mfrpublisher'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.0.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
