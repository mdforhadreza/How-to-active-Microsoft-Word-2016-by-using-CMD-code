plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mdforhadreza.mfrpublisher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mdforhadreza.mfrpublisher'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
